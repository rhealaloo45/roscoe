agent_name: google-workspace-agent

system_prompt_file: prompts/system.txt

model:
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2

# Built in code via GoogleWorkspaceConnector. Two auth modes — use one:
#
# 1) Service account + domain-wide delegation (org-wide deployments):
connectors:
  google_workspace:
    credentials_file: ${GOOGLE_SA_KEY_FILE}
    subject: ${GOOGLE_SUBJECT}
#
# 2) OAuth2 user consent (single account, no admin rights needed) — get a
#    refresh token once via `roscoe google-auth`, then swap the block above for:
# connectors:
#   google_workspace:
#     client_id: ${GOOGLE_CLIENT_ID}
#     client_secret: ${GOOGLE_CLIENT_SECRET}
#     refresh_token: ${GOOGLE_REFRESH_TOKEN}

memory:
  conversation:
    enabled: true
    window_size: 10

middleware:
  retry:
    max_attempts: 3
  rate_limiter:
    rpm: 60
  cost_tracking:
    enabled: true
  audit:
    enabled: true
  human_approval:
    require_approval_for: ["send_email", "create_event", "create_task"]
